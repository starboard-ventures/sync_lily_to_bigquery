[build-system]
requires = ["setuptools >= 61.0", "build", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sync_lily_from_timescaledb_to_bigquery"
version = "0.0.1"
description = "Synchronize lily tables from TimescaleDB to BigQuery for PL."
readme = { file = "README.md", content-type = "text/markdown" }
keywords = ["lily", "TimescaleDB", "BigQuery", "sync"]
requires-python = ">=3.12"
license = "MIT AND (Apache-2.0 OR BSD-2-Clause)"
authors = [
  {name = "pxx", email = "pxx@starboardventures.io"}
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "Development Status :: 2 - Pre-Alpha",
  "Topic :: Utilities",
  "Environment :: Console"
]
dependencies = [
  "ruff==0.11.9",
  "pyrefly>=0.36.2",
  "pandas==2.2.3",
  "pyspark==3.5.5",
  "delta-spark==3.3.1",
  "google-cloud-bigquery==3.32.0",
]

[project.scripts]
dummy = "sync_lily_from_timescaledb_to_bigquery.main:proc_dummy"
actor_codes = "sync_lily_from_timescaledb_to_bigquery.main:proc_actor_codes"
