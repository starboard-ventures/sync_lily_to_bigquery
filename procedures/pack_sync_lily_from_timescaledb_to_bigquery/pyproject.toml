[project.urls]
Repository = "https://github.com/starboard-ventures/sync_lily_to_bigquery"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["sync_lily_from_timescaledb_to_bigquery*"]

[tool.pyrefly]
project-includes = ["**/*"]
project-excludes = [
    "**/node_modules",
    "**/__pycache__",
    "**/*venv/**/*",
]

[tool.setuptools.package-data]
"*" = ["*.ini"]

